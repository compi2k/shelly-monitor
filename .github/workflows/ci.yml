name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # same as Raspberry Pi OS Bookworm

      - name: Install dependencies
        run: pip install -r collector/requirements.txt prometheus_client shellcheck-py

      - name: Scripts use LF line endings
        run: |
          if grep -lI $'\r' install.sh uninstall.sh tools/* grafana/*.py collector/*.py; then
            echo "::error::files above have Windows (CRLF) line endings"; exit 1
          fi

      - name: Shell scripts
        run: |
          bash -n install.sh uninstall.sh tools/test_collector.sh
          shellcheck install.sh uninstall.sh tools/test_collector.sh

      - name: Dashboard JSON is up to date with the generator
        run: |
          python3 grafana/gen_dashboard.py
          git diff --exit-code grafana/dashboards/shelly.json

      - name: Collector end-to-end test (fake plugs)
        run: bash tools/test_collector.sh
