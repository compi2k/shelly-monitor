name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # same as Raspberry Pi OS Bookworm

      - name: Install dependencies
        run: pip install -r collector/requirements.txt prometheus_client shellcheck-py

      - name: Scripts are executable and use LF line endings
        run: |
          for f in install.sh uninstall.sh tools/test_collector.sh tools/fake_shelly.py grafana/gen_dashboard.py; do
            [ "$(git ls-files -s "$f" | cut -c1-6)" = "100755" ] || { echo "::error file=$f::not executable in git (run: git update-index --chmod=+x $f)"; exit 1; }
            ! grep -q $'\r' "$f" || { echo "::error file=$f::has Windows (CRLF) line endings"; exit 1; }
          done

      - name: Shell scripts
        run: |
          bash -n install.sh uninstall.sh tools/test_collector.sh
          shellcheck install.sh uninstall.sh tools/test_collector.sh

      - name: Dashboard JSON is up to date with the generator
        run: |
          python3 grafana/gen_dashboard.py
          git diff --exit-code grafana/dashboards/shelly.json

      - name: Collector end-to-end test (fake plugs)
        run: bash tools/test_collector.sh
